{% extends "base.html" %}

{% block title %}Error {{ error_code }} | AgriQueue{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="agri-card shadow py-5">
        <div class="stat-icon-wrapper mx-auto mb-3" style="width: 72px; height: 72px; font-size: 2rem; background-color: #fde8e4; color: var(--terracotta);">
          <i data-lucide="alert-triangle"></i>
        </div>
        <h1 class="display-5 fw-bold text-dark">{{ error_code }}</h1>
        <h4 class="mb-3">{{ error_title }}</h4>
        <p class="text-muted mb-4">{{ error_message }}</p>
        <div class="d-flex justify-content-center gap-2">
          <a href="{{ url_for('index') }}" class="btn btn-agri-primary">Return to Home</a>
          <button onclick="history.back()" class="btn btn-outline-secondary">Go Back</button>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
